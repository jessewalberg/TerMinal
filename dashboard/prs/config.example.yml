# Example harness config for CI webhooks (ticket #0005).
# Copy to <harnessDir>/prs/config.yml and set Settings → harnessDir in TerMinal.
#
# GitLab: set the same secret as the project's webhook "Secret token";
#         sends X-Gitlab-Token header.
# GitHub: set as the webhook secret; sends X-Hub-Signature-256 (HMAC-SHA256).

repos:
  terminal:
    root: /Users/you/CompSci/gauntlet/TerMinal
    ci_webhook_secret: "replace-me-with-a-long-random-string"
